services:
  db:
    image: postgres:17.11
    container_name: fourwalls-db
    environment:
      POSTGRES_DB: fourwalls
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/00_bootstrap.local.sql:/docker-entrypoint-initdb.d/00_bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fourwalls"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

